# Server Configuration
server.port=8888

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:cozedb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA/Hibernate Configuration
# 'update' will create the database schema automatically based on the @Entity classes.
spring.jpa.hibernate.ddl-auto=update
# Show SQL statements in the log for debugging
spring.jpa.show-sql=true

# Spring AI - Alibaba DashScope Configuration
# IMPORTANT: Replace "YOUR_API_KEY" with your actual DashScope API key.
spring.ai.alibaba.dashscope.api-key=YOUR_API_KEY
spring.ai.alibaba.dashscope.chat.options.model=qwen-turbo

# Spring AI - OpenSearch Vector Store Configuration
# This is required for the Knowledge Base (RAG) feature.
# You need a running OpenSearch instance for this to work.
# spring.ai.vectorstore.opensearch.host=localhost
# spring.ai.vectorstore.opensearch.port=9200
# spring.ai.vectorstore.opensearch.username=admin
# spring.ai.vectorstore.opensearch.password=admin
# spring.ai.vectorstore.opensearch.index-name=coze-vector-store
# The embedding dimension depends on the model used. Dashscope's text-embedding-v1 is 1536.
# spring.ai.vectorstore.opensearch.embedding-dimension=1536
