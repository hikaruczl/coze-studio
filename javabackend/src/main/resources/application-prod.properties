# ========================================
# Production Environment Configuration
# ========================================

# MySQL Database Configuration for Production
spring.datasource.url=jdbc:mysql://localhost:3306/coze_studio?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=GMT%2B8
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:coze_user}
spring.datasource.password=${DB_PASSWORD:coze_password}

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# JPA Configuration for Production
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Redis Configuration for Production
spring.data.redis.enabled=true
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=0
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# Spring AI - Alibaba DashScope Configuration
spring.ai.alibaba.dashscope.api-key=${DASHSCOPE_API_KEY}
spring.ai.alibaba.dashscope.chat.options.model=${DASHSCOPE_MODEL:qwen-turbo}

# Spring AI - OpenSearch Vector Store Configuration
spring.ai.vectorstore.opensearch.host=${OPENSEARCH_HOST:localhost}
spring.ai.vectorstore.opensearch.port=${OPENSEARCH_PORT:9200}
spring.ai.vectorstore.opensearch.username=${OPENSEARCH_USERNAME:admin}
spring.ai.vectorstore.opensearch.password=${OPENSEARCH_PASSWORD:admin}
spring.ai.vectorstore.opensearch.index-name=${OPENSEARCH_INDEX:coze-vector-store}
spring.ai.vectorstore.opensearch.embedding-dimension=${OPENSEARCH_EMBEDDING_DIM:1536}

# Logging Configuration for Production
logging.level.com.coze.studio=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.file.name=logs/coze-studio.log
logging.logback.rollingpolicy.max-file-size=100MB
logging.logback.rollingpolicy.max-history=30

# Security Configuration for Production
# JWT Configuration
jwt.secret=${JWT_SECRET:coze-studio-jwt-secret-key-change-in-production}
jwt.expiration=${JWT_EXPIRATION:86400000}

# File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Actuator Configuration for Production Monitoring
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true
