# ========================================
# Development Environment Configuration
# ========================================

# H2 Database Configuration for Development
spring.datasource.url=jdbc:h2:mem:cozedb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console (for development debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration for Development
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create-drop

# Redis Configuration (Optional for development)
spring.data.redis.enabled=false
# spring.data.redis.host=localhost
# spring.data.redis.port=6379
# spring.data.redis.database=0

# Spring AI - Alibaba DashScope Configuration
# IMPORTANT: Replace "YOUR_API_KEY" with your actual DashScope API key.
spring.ai.alibaba.dashscope.api-key=YOUR_API_KEY
spring.ai.alibaba.dashscope.chat.options.model=qwen-turbo

# Spring AI - OpenSearch Vector Store Configuration (Optional)
# spring.ai.vectorstore.opensearch.host=localhost
# spring.ai.vectorstore.opensearch.port=9200
# spring.ai.vectorstore.opensearch.username=admin
# spring.ai.vectorstore.opensearch.password=admin
# spring.ai.vectorstore.opensearch.index-name=coze-vector-store
# spring.ai.vectorstore.opensearch.embedding-dimension=1536

# Logging Configuration for Development
logging.level.com.coze.studio=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Security Configuration for Development
spring.security.user.name=admin
spring.security.user.password=admin123
spring.security.user.roles=ADMIN

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# Disable DashScope auto-config in dev to avoid missing API key failures
spring.ai.dashscope.enabled=false
spring.ai.dashscope.agent.enabled=false


# Disable DB init on dev to avoid MyBatis XML missing statements
app.init-db=false
